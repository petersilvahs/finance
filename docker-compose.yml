services:
  postgres:
    image: postgres:16-alpine
    container_name: corebanking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: corebanking_user
      POSTGRES_PASSWORD: corebanking_password
      POSTGRES_DB: corebanking_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebanking_user -d corebanking_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: corebanking-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol port (.NET MassTransit / RabbitMQ.Client)
      - "15672:15672" # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.4
    container_name: corebanking-localstack
    restart: unless-stopped
    ports:
      - "4566:4566" # LocalStack Edge Port (AWS S3, SQS, SNS, SecretsManager)
    environment:
      - SERVICES=s3,sqs,sns,secretsmanager
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  rabbitmq_data:
  localstack_data:

